[project]
name = "learning-star"
version = "0.1.0"
description = "Learning Star：语言学习 + 课程，单一 Django 后端（backend/）"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5,<6.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
# 只在开发机使用（scripts/optimize_images.py）
dev = [
    "pillow>=11",
]

[tool.uv]
package = false
