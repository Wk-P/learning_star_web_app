# Learning Star：一个前端（web/dist）+ 一个后端（backend/，gunicorn 127.0.0.1:{{PORT}}）
#   /api/*          → 后端 API：登录、账号、语言学习、课程
#   /media/*        → 后端受保护媒体（校验登录 cookie 与目录权限，支持 Range）
#   /django-admin/* → Django 自带管理后台（备用）
# 由 scripts/deploy.py 渲染 {{...}} 占位后安装到 /etc/nginx/conf.d/
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 60M;

    root {{APP_DIR}}/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:{{PORT}}/api/;
        include snippets/learning_star_proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:{{PORT}}/media/;
        include snippets/learning_star_proxy.conf;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /django-admin/ {
        proxy_pass http://127.0.0.1:{{PORT}}/django-admin/;
        include snippets/learning_star_proxy.conf;
    }

    # Django admin 静态文件（collectstatic 生成）
    location /static/ {
        alias {{APP_DIR}}/staticfiles/;
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(webp|png|svg|ico)$ {
        expires 30d;
    }

    # 前端路由（含旧网址 /topik、/user/*、/home 等的跳转）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# 原课程站的 8080 端口：整体跳到新站，旧链接由前端路由转到新地址
server {
    listen 8080;
    server_name _;
    return 301 http://$host$request_uri;
}
