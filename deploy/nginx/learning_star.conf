# 上海节点 80 端口：/topik/ → 韩途 (gunicorn :8000)，/course/ → 课程站 (gunicorn :8001)
# 安装由 deploy/deploy.sh nginx 完成
server {
    listen 80 default_server;
    server_name 139.224.222.27 _;
    client_max_body_size 60M;

    root /home/ecs-user/learning_star/landing;
    index index.html;

    location = / { try_files /index.html =404; }

    # ── 韩途 TOPIK ───────────────────────────────────────────────
    location = /topik { return 301 /topik/; }

    location /topik/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        include snippets/learning_star_proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 受保护媒体：交给 Django ProtectedMediaView 校验 JWT cookie（支持 Range）
    location /topik/media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        include snippets/learning_star_proxy.conf;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /topik/static/ {
        alias /home/ecs-user/player3/backend/staticfiles/;
        expires 30d;
    }

    location /topik/assets/ {
        alias /home/ecs-user/player3/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /topik/ {
        alias /home/ecs-user/player3/frontend/dist/;
        try_files $uri $uri/ /topik/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── 课程站 Course ────────────────────────────────────────────
    location = /course { return 301 /course/; }

    location /course/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        include snippets/learning_star_proxy.conf;
        proxy_read_timeout 120s;
    }

    location /course/media/ {
        alias /home/ecs-user/course_system/backend/media/;
        expires 7d;
    }

    location /course/assets/ {
        alias /home/ecs-user/course_system/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /course/ {
        alias /home/ecs-user/course_system/frontend/dist/;
        try_files $uri $uri/ /course/index.html;
        add_header Cache-Control "no-cache";
    }
}
