# Learning Star：一个前端（web/）+ 两个后端
#   /api/topik/*  → topik  gunicorn :8000/api/*   账号/登录、韩语视频音频资料、权限
#   /api/course/* → course gunicorn :8001/api/*   科目、B 站链接、路线图
#   /media/*      → topik  受保护媒体（Django 校验登录 cookie，支持 Range）
# 安装由 deploy/deploy.sh nginx 完成
server {
    listen 80 default_server;
    server_name 139.224.222.27 _;
    client_max_body_size 60M;

    root /home/ecs-user/learning_star/web/dist;
    index index.html;

    location /api/topik/ {
        proxy_pass http://127.0.0.1:8000/api/;
        include snippets/learning_star_proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/course/ {
        proxy_pass http://127.0.0.1:8001/api/;
        include snippets/learning_star_proxy.conf;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        include snippets/learning_star_proxy.conf;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Django admin 静态文件
    location /static/ {
        alias /home/ecs-user/player3/backend/staticfiles/;
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(webp|png|svg|ico)$ {
        expires 30d;
    }

    # 前端路由（含旧网址 /user/*、/home 等的跳转）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# 原课程站的 8080 端口：整体跳到新站，旧链接由前端路由转到新地址
server {
    listen 8080;
    server_name 139.224.222.27 _;
    return 301 http://$host$request_uri;
}
